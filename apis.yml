name: Tenet Healthcare
description: >-
  Tenet Healthcare is a diversified healthcare services company and Fortune 500 organization operating regionally
  focused, integrated healthcare delivery networks. The company operates acute care hospitals, ambulatory surgery
  centers (ASCs), and physician practices across the United States through United Surgical Partners International (USPI)
  and Tenet Health. Tenet also provides revenue cycle management services through Conifer Health Solutions.
